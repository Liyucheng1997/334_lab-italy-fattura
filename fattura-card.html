<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开票信息卡</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #dcdad3; --accent: #1f5f4a; --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; margin-bottom: 10px; }
  label span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  label span b { color: var(--ink); font-weight: 600; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; background: #fff; color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff;
    font: inherit; cursor: pointer; color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-size: 13px; }
  .checks input { width: auto; }
  .card dt i, .sheet dt i { font-style: normal; color: #888; margin-left: 0.8mm; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .qrup { display: none; align-items: center; gap: 10px; margin-bottom: 10px; }
  .qrup.on { display: flex; }
  .qrup img { width: 48px; height: 48px; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .qrup .st { font-size: 12px; color: var(--muted); flex: 1; }
  .qr img { object-fit: contain; }
  .preview-box { display: flex; justify-content: center; padding: 10px 0; }

  /* ---------- the card (real size 85 x 55 mm) ---------- */
  .card { width: 85mm; height: 55mm; background: #fff; color: #111; border: 0.3mm solid #999;
    border-radius: 2mm; padding: 3.2mm 3.5mm; display: flex; gap: 2.5mm; overflow: hidden;
    font-family: Arial, Helvetica, sans-serif; }
  .card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card .head { font-size: 6.2pt; letter-spacing: .04em; text-transform: uppercase; color: #555;
    border-bottom: 0.25mm solid #111; padding-bottom: 0.8mm; margin-bottom: 1.2mm; }
  .card .name { font-size: 9pt; font-weight: 700; line-height: 1.15; margin-bottom: 1mm; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 1.5mm; row-gap: 0.25mm;
    font-size: 6.6pt; line-height: 1.25; }
  .card dt { color: #555; white-space: nowrap; }
  .card dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .card .qr { width: 20mm; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .card .qr canvas, .card .qr img { width: 20mm !important; height: 20mm !important; }
  .card .qr small { font-size: 4.8pt; color: #666; margin-top: 0.5mm; text-align: center; }
  .card.noqr .qr { display: none; }

  /* big A5 sheet version */
  .sheet { width: 148mm; min-height: 105mm; background: #fff; color: #111; border: 0.3mm solid #999;
    padding: 8mm 9mm; font-family: Arial, Helvetica, sans-serif; display: flex; gap: 6mm; }
  .sheet .txt { flex: 1; }
  .sheet .head { font-size: 9pt; text-transform: uppercase; letter-spacing: .05em; color: #555;
    border-bottom: 0.4mm solid #111; padding-bottom: 1.5mm; margin-bottom: 3mm; }
  .sheet .name { font-size: 15pt; font-weight: 700; margin-bottom: 2.5mm; }
  .sheet dl { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 4mm; row-gap: 1.2mm; font-size: 10.5pt; }
  .sheet dt { color: #555; }
  .sheet dd { margin: 0; font-weight: 600; }
  .sheet .qr { width: 32mm; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .sheet .qr canvas, .sheet .qr img { width: 32mm !important; height: 32mm !important; }
  .sheet .qr small { font-size: 7pt; color: #666; margin-top: 1mm; }
  .sheet.noqr .qr { display: none; }
  .sheet .ask { font-size: 10pt; margin-top: 4mm; font-style: italic; color: #333; }

  /* quarter A4 (landscape A4, 2 x 2 = 4 per page), 140 x 96 mm */
  .sheet.quarter { width: 140mm; height: 96mm; min-height: 0; padding: 7mm 8mm; gap: 5mm; overflow: hidden; }
  .sheet.quarter .head { font-size: 8.5pt; margin-bottom: 2.5mm; }
  .sheet.quarter .name { font-size: 14pt; margin-bottom: 2mm; }
  .sheet.quarter dl { font-size: 10pt; row-gap: 1mm; column-gap: 3.5mm; }
  .sheet.quarter dd { overflow-wrap: anywhere; }
  .sheet.quarter .qr { width: 30mm; flex: none; }
  .sheet.quarter .qr canvas, .sheet.quarter .qr img { width: 30mm !important; height: 30mm !important; }
  .sheet.quarter .ask { font-size: 9pt; margin-top: 3mm; }

  #printArea { display: none; }

  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; }
    .wrap { display: none; }
    #printArea { display: block; }
    #printArea.cards { display: grid; grid-template-columns: 85mm 85mm; gap: 0; justify-content: center; }
    #printArea.cards .card { border-radius: 0; border: 0.2mm dashed #aaa; }
    #printArea .sheet { margin: 0 auto 10mm; page-break-inside: avoid; }
    #printArea.quarters { display: grid; grid-template-columns: 140mm 140mm; gap: 0; justify-content: center; }
    #printArea.quarters .sheet { margin: 0; border: 0.2mm dashed #aaa; }
    .card, .sheet { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>意大利开票信息卡 · Dati per la fattura</h1>
  <p class="sub">填一次，自动保存在本浏览器里。打印出来剪成名片大小放钱包，买东西时直接递给店员。</p>

  <div class="grid">
    <div class="panel">
      <h2>1. 填写公司信息</h2>
      <label><span><b>公司名称</b> · Ragione sociale</span><input id="ragione" placeholder="ROSSI S.R.L."></label>
      <div class="row">
        <label><span><b>增值税号</b> · Partita IVA</span><input id="piva" placeholder="IT01234567890"></label>
        <label><span><b>税号</b> · Codice Fiscale（与P.IVA相同可留空）</span><input id="cf" placeholder=""></label>
      </div>
      <label><span><b>注册地址</b> · Sede legale (Via, n°)</span><input id="via" placeholder="Via Roma 1"></label>
      <div class="row3">
        <label><span><b>邮编</b> · CAP</span><input id="cap" placeholder="20100"></label>
        <label><span><b>城市</b> · Città</span><input id="citta" placeholder="Milano"></label>
        <label><span><b>省</b> · Prov.</span><input id="prov" placeholder="MI" maxlength="2"></label>
      </div>
      <div class="row">
        <label><span><b>SDI 收票代码</b> · Codice Destinatario（7位）</span><input id="sdi" placeholder="M5UXCR1" maxlength="7"></label>
        <label><span><b>PEC 邮箱</b> · PEC</span><input id="pec" placeholder="azienda@pec.it"></label>
      </div>
      <div class="row">
        <label><span><b>联系人</b> · Referente</span><input id="ref" placeholder="Mario Rossi"></label>
        <label><span><b>电话</b> · Telefono</span><input id="tel" placeholder="+39 333 1234567"></label>
      </div>
      <label><span><b>邮箱</b> · Email</span><input id="email" placeholder="info@azienda.it"></label>

      <h2 style="margin-top:18px">2. 打印选项</h2>
      <div class="row">
        <label><span>版式</span>
          <select id="layout">
            <option value="cards">名片 85×55mm（A4 一页 10 张）</option>
            <option value="quarter" selected>中卡 140×96mm（A4 横向一页 4 张）</option>
            <option value="sheet">大卡 A6/A5（A4 一页 2 张）</option>
          </select>
        </label>
        <label><span>二维码</span>
          <select id="qr">
            <option value="1">自动生成（店员可用手机扫）</option>
            <option value="img">用我上传的图片（如税务局官方二维码）</option>
            <option value="0">不显示</option>
          </select>
        </label>
      </div>
      <div class="qrup" id="qrUp">
        <img id="qrThumb" alt="" hidden>
        <span class="st" id="qrStatus">还没有上传。PDF 请先截图，裁剪出二维码部分再上传。</span>
        <button id="qrPick">上传图片</button>
        <button id="qrDel" hidden>移除</button>
        <input type="file" id="qrFile" accept="image/*" hidden>
      </div>
      <div class="row">
        <label><span>卡片语言</span>
          <select id="lang">
            <option value="it">仅意大利语</option>
            <option value="both">意大利语 + 中文</option>
          </select>
        </label>
        <label><span>二维码下方文字</span><input id="qrcap" placeholder="Scansiona i dati"></label>
      </div>
      <span style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">卡片上显示哪些项（没勾的不打印）</span>
      <div class="checks" id="checks"></div>
      <div class="btns">
        <button class="primary" id="printBtn">打印</button>
        <button id="exportBtn">导出备份</button>
        <button id="importBtn">导入备份</button>
        <button id="clearBtn">清空</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <p class="hint">打印时请在打印设置里选“实际大小 / 100%”，不要选“适合页面”，否则名片尺寸会变。建议用稍厚的纸（160–250g），打完可塑封。</p>
    </div>

    <div class="panel">
      <h2>预览（实际尺寸）</h2>
      <div class="preview-box" id="preview"></div>
    </div>
  </div>
</div>

<div id="printArea"></div>
<style id="pageStyle"></style>

<script>
const FIELDS = ["ragione","piva","cf","via","cap","citta","prov","sdi","pec","ref","tel","email","qrcap"];
const KEY = "fattura-card-v1";
const $ = id => document.getElementById(id);
// field key, card label, Chinese label
const ROWS = [
  ["piva", "P.IVA", "增值税号"],
  ["cf", "C.F.", "税号"],
  ["sede", "Sede", "地址"],
  ["sdi", "Cod. SDI", "收票代码"],
  ["pec", "PEC", "PEC邮箱"],
  ["ref", "Rif.", "联系人"],
  ["tel", "Tel.", "电话"],
  ["email", "Email", "邮箱"],
];
$("checks").innerHTML = ROWS.map(r =>
  `<label><input type="checkbox" data-show="${r[0]}" checked>${r[2]}</label>`).join("");
const showBoxes = [...document.querySelectorAll("[data-show]")];
let qrImg = ""; // uploaded QR image as data URL

function apply(d, reset) {
  FIELDS.forEach(f => { if (d[f] != null || reset) $(f).value = d[f] || ""; });
  if (d.layout) $("layout").value = d.layout;
  if (d.qr != null) $("qr").value = d.qr;
  if (d.lang) $("lang").value = d.lang;
  if (d.show) showBoxes.forEach(b => b.checked = d.show.includes(b.dataset.show));
  if (d.qrImg != null || reset) qrImg = d.qrImg || "";
}
function load() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  apply(d);
}
function data() {
  const d = {};
  FIELDS.forEach(f => d[f] = $(f).value.trim());
  d.layout = $("layout").value; d.qr = $("qr").value; d.lang = $("lang").value;
  d.show = showBoxes.filter(b => b.checked).map(b => b.dataset.show);
  d.qrImg = qrImg;
  return d;
}
let warnedFull = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data())); }
  catch (e) {
    if (qrImg && e.name === "QuotaExceededError" && !warnedFull) {
      warnedFull = true;
      alert("二维码图片太大，没能保存到浏览器里，请换一张小一点的图片。");
    }
  }
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rows(d) {
  const addr = [d.via, [d.cap, d.citta, d.prov ? "(" + d.prov.toUpperCase() + ")" : ""].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const val = { ...d, sede: addr, sdi: d.sdi.toUpperCase() };
  const show = d.show || ROWS.map(r => r[0]);
  return ROWS.filter(r => show.includes(r[0]) && val[r[0]])
    .map(r => [r[1], val[r[0]], r[2]]);
}
function qrText(d) {
  return [d.ragione, ...rows(d).map(r => r[0] + ": " + r[1])].join("\n");
}
// layout -> card class, cards per A4 page, printArea class, @page rule
const LAYOUTS = {
  card: { cls: "card", n: 10, area: "cards", page: "size: A4; margin: 10mm;" },
  quarter: { cls: "sheet quarter", n: 4, area: "quarters", page: "size: A4 landscape; margin: 8mm;" },
  sheet: { cls: "sheet", n: 2, area: "sheets", page: "size: A4; margin: 10mm;" },
};
const layoutOf = d => LAYOUTS[d.layout] || LAYOUTS.card;
function cardHTML(d, cls) {
  const dl = rows(d).map(r => `<dt>${r[0]}${d.lang === "both" ? `<i>${r[2]}</i>` : ""}</dt><dd>${esc(r[1])}</dd>`).join("");
  const ask = cls.startsWith("sheet") ? `<div class="ask">Gentilmente, mi può emettere fattura elettronica con questi dati? Grazie!</div>` : "";
  return `<div class="${cls}${hasQR(d) ? "" : " noqr"}">
    <div class="txt">
      <div class="head">Dati per la fattura elettronica</div>
      <div class="name">${esc(d.ragione || "RAGIONE SOCIALE")}</div>
      <dl>${dl}</dl>${ask}
    </div>
    <div class="qr"><div class="qrc"></div><small>${esc(d.qrcap || "Scansiona i dati")}</small></div>
  </div>`;
}
const hasQR = d => d.qr === "img" ? !!d.qrImg : d.qr !== "0";
function fillQR(root, d) {
  if (d.qr === "img" && d.qrImg) {
    root.querySelectorAll(".qrc").forEach(el => { el.innerHTML = `<img src="${d.qrImg}" alt="QR">`; });
    return;
  }
  if (!hasQR(d) || typeof QRCode === "undefined") {
    root.querySelectorAll(".qr").forEach(q => q.style.display = "none");
    return;
  }
  const text = qrText(d);
  root.querySelectorAll(".qrc").forEach(el => {
    new QRCode(el, { text, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
  });
}
function render() {
  const d = data();
  $("qrUp").classList.toggle("on", d.qr === "img");
  $("qrThumb").hidden = $("qrDel").hidden = !qrImg;
  if (qrImg) $("qrThumb").src = qrImg;
  $("qrStatus").textContent = qrImg ? "已上传，会替换卡片上的二维码。" : "还没有上传。PDF 请先截图，裁剪出二维码部分再上传。";
  const p = $("preview");
  p.innerHTML = cardHTML(d, layoutOf(d).cls);
  fillQR(p, d);
  save();
}
function buildPrint() {
  const d = data();
  const pa = $("printArea");
  const L = layoutOf(d);
  $("pageStyle").textContent = `@media print { @page { ${L.page} } }`;
  pa.className = L.area;
  pa.innerHTML = Array.from({length: L.n}, () => cardHTML(d, L.cls)).join("");
  fillQR(pa, d);
}

FIELDS.concat(["layout","qr","lang"]).forEach(f => $(f).addEventListener("input", render));
showBoxes.forEach(b => b.addEventListener("change", render));
$("printBtn").onclick = () => { buildPrint(); setTimeout(() => window.print(), 300); };
$("clearBtn").onclick = () => {
  if (!confirm("确定清空所有信息？")) return;
  FIELDS.forEach(f => $(f).value = ""); qrImg = ""; render();
};
$("qrPick").onclick = () => $("qrFile").click();
$("qrDel").onclick = () => { qrImg = ""; render(); };
$("qrFile").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const img = new Image();
  img.onload = () => {
    // shrink big photos so they fit in localStorage; QR stays sharp at 1200px
    const k = Math.min(1, 1200 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    qrImg = c.toDataURL("image/png");
    $("qr").value = "img"; render();
  };
  img.onerror = () => alert("无法读取这个图片文件");
  img.src = URL.createObjectURL(f);
};
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(data(), null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "fattura-dati.json"; a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      apply(JSON.parse(t), true);
      render();
    } catch (err) { alert("文件格式不对"); }
  });
};
window.addEventListener("beforeprint", buildPrint);

load(); render();
</script>
</body>
</html>
